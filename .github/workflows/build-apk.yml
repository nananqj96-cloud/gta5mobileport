name: Build PS5 Mobile APK

on:
  push:
    branches: ["main", "arena/*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Locate Android SDK Build-Tools & Platform 34
        id: sdk
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT_DIR="$(ls -d "$SDK/build-tools/34."* 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$BT_DIR" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34"
            BT_DIR="$SDK/build-tools/34.0.0"
          fi
          if [ ! -f "$SDK/platforms/android-34/android.jar" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34"
          fi
          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"
          echo "build_tools=$BT_DIR" >> "$GITHUB_OUTPUT"
          echo "android_jar=$SDK/platforms/android-34/android.jar" >> "$GITHUB_OUTPUT"

      - name: Build Signed PS5 Mobile APK
        env:
          ANDROID_SDK_ROOT: ${{ steps.sdk.outputs.sdk }}
          BUILD_TOOLS: ${{ steps.sdk.outputs.build_tools }}
          ANDROID_JAR: ${{ steps.sdk.outputs.android_jar }}
        run: |
          chmod +x scripts/build-apk.sh
          if ! ./scripts/build-apk.sh releases/PS5-Mobile.apk > /tmp/apk-build.log 2>&1; then
            cat /tmp/apk-build.log
            tail -n 25 /tmp/apk-build.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi
          cat /tmp/apk-build.log

      - name: Verify APK Manifest & JS Bridge
        env:
          BUILD_TOOLS: ${{ steps.sdk.outputs.build_tools }}
        run: |
          "$BUILD_TOOLS/aapt2" dump badging releases/PS5-Mobile.apk
          node --check app/src/main/assets/mobile_bridge.js
          node --check app/src/main/assets/bc_decode.js

      - name: Upload CI-Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS5-Mobile-APK
          path: releases/PS5-Mobile.apk

      - name: Commit Signed APK to Branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f releases/PS5-Mobile.apk
          if ! git diff --cached --quiet; then
            git commit -m "Build signed PS5 Mobile v3.0.0 Ultra Optimize APK [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
