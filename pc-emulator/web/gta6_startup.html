<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grand Theft Auto VI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #000;
    font-family: 'Bahnschrift', 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif;
    color: #fff;
  }
  #stage {
    position: fixed; inset: 0; background: #000; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  #intro-video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; background: #000; opacity: 0;
    transition: opacity 0.25s ease;
  }
  #intro-video.ready { opacity: 1; }
  #fade-curtain {
    position: fixed; inset: 0; background: #000; opacity: 0;
    pointer-events: none; z-index: 40; transition: opacity 0.42s ease;
  }
  #fade-curtain.on { opacity: 1; }
  #unmute-pill {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); z-index: 25;
    padding: 9px 20px; border-radius: 999px;
    background: rgba(12, 14, 24, 0.78); backdrop-filter: blur(12px);
    border: 1px solid rgba(240, 74, 152, 0.72);
    color: #fff; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    cursor: pointer; display: none; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.65);
  }
  #unmute-pill:hover { background: rgba(240, 74, 152, 0.34); }
  #skip-pill {
    position: fixed; right: 28px; bottom: 26px; z-index: 25;
    padding: 7px 15px; border-radius: 999px;
    background: rgba(10, 12, 20, 0.54); backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: rgba(255, 255, 255, 0.78); font-size: 11px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer;
    opacity: 0; transition: opacity 0.35s ease, background 0.15s, border-color 0.15s;
  }
  #skip-pill.show { opacity: 1; }
  #skip-pill:hover { background: rgba(240, 74, 152, 0.28); border-color: rgba(240, 74, 152, 0.72); color: #fff; }
</style>
</head>
<body>
<div id="stage">
  <video id="intro-video" playsinline preload="auto"></video>
</div>
<button id="unmute-pill">Click to Enable Audio</button>
<button id="skip-pill">Skip &nbsp;[Space / ✕]</button>
<div id="fade-curtain"></div>

<script>
(function () {
  'use strict';

  // Preserve every gameplay query parameter (mode, map, res, fps, vbx_from, vbx_perf_auto, args...)
  // and pass vbx_intro_done=1 so /play/ lands directly on the GTA VI Main Menu after this intro finishes.
  const qs = new URLSearchParams(window.location.search);
  qs.set('vbx_gta6', '1');
  qs.set('vbx_intro_done', '1');
  qs.delete('vbx_skip_intro');
  if (!qs.get('mode')) qs.set('mode', 'sandbox');
  const targetPlayUrl = '/play/?' + qs.toString();

  const video = document.getElementById('intro-video');
  const unmuteBtn = document.getElementById('unmute-pill');
  const skipBtn = document.getElementById('skip-pill');
  const curtain = document.getElementById('fade-curtain');

  let done = false;
  let hardTimer = null;

  function proceedToMenu() {
    if (done) return;
    done = true;
    clearTimeout(hardTimer);
    curtain.classList.add('on');
    try { video.pause(); } catch (e) {}
    setTimeout(() => { window.location.replace(targetPlayUrl); }, 380);
  }

  // Reveal subtle skip pill after 1.1s so the opening frames stay completely pure
  setTimeout(() => { if (!done) skipBtn.classList.add('show'); }, 1100);
  // Generous safety cap (22s for 16s intro) so playback can never stall forever
  hardTimer = setTimeout(proceedToMenu, 22000);

  skipBtn.addEventListener('click', (e) => { e.stopPropagation(); proceedToMenu(); });

  unmuteBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    video.muted = false;
    video.volume = 1.0;
    video.play().catch(() => {});
    unmuteBtn.style.display = 'none';
  });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'Escape') {
      e.preventDefault();
      proceedToMenu();
    }
  });

  // Allow PS5 DualSense / Xbox controller (Cross/A, Circle/B, Options/Start) to skip cleanly
  let padInit = false;
  let prevSkipHeld = true;
  function pollGamepad() {
    if (done) return;
    try {
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      let skipDown = false;
      for (let i = 0; i < pads.length; i++) {
        const gp = pads[i];
        if (!gp || !gp.connected) continue;
        const b = gp.buttons;
        if ((b[0] && b[0].pressed) || (b[1] && b[1].pressed) || (b[9] && b[9].pressed)) {
          skipDown = true;
        }
      }
      if (!padInit) { padInit = true; prevSkipHeld = skipDown; }
      else if (skipDown && !prevSkipHeld) { proceedToMenu(); return; }
      prevSkipHeld = skipDown;
    } catch (e) {}
    requestAnimationFrame(pollGamepad);
  }
  requestAnimationFrame(pollGamepad);

  video.addEventListener('loadeddata', () => {
    video.classList.add('ready');
  });
  video.addEventListener('ended', proceedToMenu);
  video.addEventListener('error', () => {
    // If embedded video somehow fails, proceed immediately without hanging
    setTimeout(proceedToMenu, 250);
  });

  async function startNativePlayback() {
    let srcUrl = '/vbx/media/gta6_intro.mp4';
    try {
      const r = await fetch('/vbx/api/intro-status', { cache: 'no-store' });
      const info = await r.json();
      if (info && info.ready && info.video) {
        srcUrl = info.video;
      }
    } catch (e) {}

    video.src = srcUrl;
    video.muted = false;
    video.volume = 1.0;

    try {
      await video.play();
      video.classList.add('ready');
    } catch (err) {
      // Browser autoplay policy blocked unmuted playback before user gesture: start muted immediately + show crisp unmute pill
      video.muted = true;
      try {
        await video.play();
        video.classList.add('ready');
        unmuteBtn.style.display = 'block';
      } catch (err2) {
        proceedToMenu();
      }
    }
  }

  startNativePlayback();
})();
</script>
</body>
</html>
