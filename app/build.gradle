plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ps5.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.ps5.mobile"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Pure Android framework build — zero external AAR bloat for minimal APK size & low-end RAM footprint
}
